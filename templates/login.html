{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            
            <form action="/login" class="bg-white rounded-4 shadow-sm p-4 p-md-5" method="post">

                <p class="text-uppercase fw-bold text-pizza mb-2">Welcome back</p>
                <h1 class="mb-4 fw-bold">Login</h1>
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                
                <div class="input-group mb-3">
                    <span class="input-group-text" id="basic-addon1">@</span>
                    <input placeholder="Username" name="username" class="form-control" required>
                </div>
                
                <div class="input-group mb-4">
                    <input type="password" placeholder="Password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-pizza w-100">Login</button>
                
                <div class="mt-4">
                    <h6>
                        Don't have an account? <a href="{{ url_for('register') }}" class="text-decoration-none">Sign up here.</a>
                    </h6>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
