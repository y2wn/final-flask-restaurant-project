{% extends 'base.html' %}

{% block title %}Add to Cart{% endblock %}

{% block content %}
    <div class="mt-4 m-2">
        <h1>{{ position.name }}</h1>
        <h2 class="text-muted ms-3">{{ position.description }}</p>
        <h4 class="mb-4">${{ position.price }}</h4>
    </div>
    <form class="p-2" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="name" value="{{ position.name }}">

    <input class="form-control w-auto m-1" type="number" value="1" min="1" max="99" name="amount">
    <select class="form-select w-auto m-1" name="size">
        <option value="Small">Small</option>
        <option value="Medium">Medium</option>
        <option value="Large">Large</option>
    </select>
    <button class="btn btn-light m-1" type="submit">Add to cart</button>
    </form>
{% endblock %}
